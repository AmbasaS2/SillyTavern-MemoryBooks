<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1448" viewBox="0 0 900 1448" font-family="Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="Memory Books / Two roles"><rect width="900" height="1448" fill="#eff3f5"/><rect x="38" y="30" width="10" height="68" rx="5" fill="#647f8b"/><text x="68" y="57" font-size="36" fill="#293a43" font-weight="600">Memory Books / Two roles</text><text x="68" y="92" font-size="28" fill="#647f8b" font-weight="400">기억은 목적에 따라 두 권으로 관리</text><rect x="38" y="128" width="824" height="372" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="171" font-size="33" fill="#293a43" font-weight="600">Nexus</text><text x="65" y="206" font-size="30" fill="#647f8b" font-weight="600">핵심 정보와 현재 상태</text><path d="M65 225H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="248" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="277" font-size="28" fill="#293a43" font-weight="600">Core facts and continuity</text><text x="83" y="307" font-size="26" fill="#647f8b" font-weight="400">지속되는 핵심 사실 · 현재 상태</text><rect x="65" y="332" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="361" font-size="28" fill="#293a43" font-weight="600">Example: they are now allies</text><text x="83" y="391" font-size="26" fill="#647f8b" font-weight="400">예: 현재 두 사람은 동맹 관계</text><rect x="65" y="416" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="445" font-size="28" fill="#293a43" font-weight="600">Relevant updates, not a new scene log</text><text x="83" y="475" font-size="26" fill="#647f8b" font-weight="400">장면 목록이 아니라 필요한 상태를 갱신</text><rect x="38" y="520" width="824" height="456" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="563" font-size="33" fill="#293a43" font-weight="600">Memory</text><text x="65" y="598" font-size="30" fill="#647f8b" font-weight="600">기억할 장면</text><path d="M65 617H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="640" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="669" font-size="28" fill="#293a43" font-weight="600">Scene 001 · The first meeting</text><text x="83" y="699" font-size="26" fill="#647f8b" font-weight="400">Scene 001 · 첫 만남</text><rect x="65" y="724" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="753" font-size="28" fill="#293a43" font-weight="600">Scene 002 · The promise</text><text x="83" y="783" font-size="26" fill="#647f8b" font-weight="400">Scene 002 · 약속</text><rect x="65" y="808" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="837" font-size="28" fill="#293a43" font-weight="600">Scene 003 · The conflict</text><text x="83" y="867" font-size="26" fill="#647f8b" font-weight="400">Scene 003 · 갈등</text><rect x="65" y="892" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="921" font-size="28" fill="#293a43" font-weight="600">Keep events separate</text><text x="83" y="951" font-size="26" fill="#647f8b" font-weight="400">사건을 한 덩어리로 합치지 않음</text><rect x="38" y="996" width="824" height="372" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="1039" font-size="33" fill="#293a43" font-weight="600">Recall during RP</text><text x="65" y="1074" font-size="30" fill="#647f8b" font-weight="600">롤플 중 기억 호출</text><path d="M65 1093H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="1116" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="1145" font-size="28" fill="#293a43" font-weight="600">Recent 3 completed scenes: always on</text><text x="83" y="1175" font-size="26" fill="#647f8b" font-weight="400">최근 완료 장면 3개: 상시 주입</text><rect x="65" y="1200" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="1229" font-size="28" fill="#293a43" font-weight="600">Older scenes: keywords or vectors</text><text x="83" y="1259" font-size="26" fill="#647f8b" font-weight="400">오래된 장면: 키워드 또는 벡터</text><rect x="65" y="1284" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="1313" font-size="28" fill="#293a43" font-weight="600">Optional STLO: Jev selects relevant lore</text><text x="83" y="1343" font-size="26" fill="#647f8b" font-weight="400">선택 STLO: Jev가 관련 로어 선택</text><text x="42" y="1416" font-size="23" fill="#647f8b" font-weight="400">Illustrated guide / 실제 캡처가 아닌 구성도</text></svg>