<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1098" viewBox="0 0 900 1098" font-family="Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="Memory Books Quick start"><rect width="900" height="1098" fill="#eff3f5"/><rect x="38" y="30" width="10" height="100" rx="5" fill="#647f8b" stroke="none" stroke-width="2"/><text x="68" y="59" font-size="38" fill="#293a43" font-weight="600">메모리북 · For 게으름뱅이</text><text x="68" y="98" font-size="30" fill="#647f8b" font-weight="600">Memory Books / Quick start</text><rect x="38" y="170" width="824" height="210" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="212" font-size="34" fill="#293a43" font-weight="600">01  Nexus와 Memory</text><text x="65" y="248" font-size="29" fill="#647f8b" font-weight="600">Two lorebook roles</text><path d="M65 268H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="285" width="770" height="76" rx="9" fill="#eff3f5" stroke="none" stroke-width="2"/><text x="83" y="316" font-size="29" fill="#293a43" font-weight="600">Nexus: 현재 상태 · Memory: 완료 사건</text><text x="83" y="348" font-size="26" fill="#647f8b" font-weight="400">Nexus: continuity / Memory: events</text><rect x="38" y="400" width="824" height="210" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="442" font-size="34" fill="#293a43" font-weight="600">02  사건 수집 및 검토</text><text x="65" y="478" font-size="29" fill="#647f8b" font-weight="600">Collect and review</text><path d="M65 498H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="515" width="770" height="76" rx="9" fill="#eff3f5" stroke="none" stroke-width="2"/><text x="83" y="546" font-size="29" fill="#293a43" font-weight="600">범위 확인 → 계획 확인 → 저장 승인</text><text x="83" y="578" font-size="26" fill="#647f8b" font-weight="400">Range → event plan → approve save</text><rect x="38" y="630" width="824" height="210" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="672" font-size="34" fill="#293a43" font-weight="600">03  기억은 그대로 유지</text><text x="65" y="708" font-size="29" fill="#647f8b" font-weight="600">Keep scene text</text><path d="M65 728H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="745" width="770" height="76" rx="9" fill="#eff3f5" stroke="none" stroke-width="2"/><text x="83" y="776" font-size="29" fill="#293a43" font-weight="600">최근 3개 상시 · 이전 사건 조건부 호출</text><text x="83" y="808" font-size="26" fill="#647f8b" font-weight="400">Latest 3 always on / older recall</text><rect x="38" y="860" width="824" height="210" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="902" font-size="34" fill="#293a43" font-weight="600">04  선택적 연동</text><text x="65" y="938" font-size="29" fill="#647f8b" font-weight="600">Optional integrations</text><path d="M65 958H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="975" width="770" height="76" rx="9" fill="#eff3f5" stroke="none" stroke-width="2"/><text x="83" y="1006" font-size="29" fill="#293a43" font-weight="600">STLO 호출 · WII 확인 · 매니저 열람</text><text x="83" y="1038" font-size="26" fill="#647f8b" font-weight="400">STLO recall / WII inspect / library read</text></svg>
