<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1448" viewBox="0 0 900 1448" font-family="Arial,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="Memory Books / Workflow"><rect width="900" height="1448" fill="#eff3f5"/><rect x="38" y="30" width="10" height="68" rx="5" fill="#647f8b"/><text x="68" y="57" font-size="36" fill="#293a43" font-weight="600">Memory Books / Workflow</text><text x="68" y="92" font-size="28" fill="#647f8b" font-weight="400">롤플 → 기억 수집 → 다시 롤플</text><rect x="38" y="128" width="824" height="288" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="171" font-size="33" fill="#293a43" font-weight="600">01 Roleplay normally</text><text x="65" y="206" font-size="30" fill="#647f8b" font-weight="600">평소처럼 롤플</text><path d="M65 225H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="248" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="277" font-size="28" fill="#293a43" font-weight="600">Finish a scene; click Collect memories</text><text x="83" y="307" font-size="26" fill="#647f8b" font-weight="400">사건이 끝나면 기억 수집 하기</text><rect x="65" y="332" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="361" font-size="28" fill="#293a43" font-weight="600">Confirm the uncollected message range</text><text x="83" y="391" font-size="26" fill="#647f8b" font-weight="400">아직 수집하지 않은 메시지 범위 확인</text><rect x="38" y="436" width="824" height="372" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="479" font-size="33" fill="#293a43" font-weight="600">02 Review event plan</text><text x="65" y="514" font-size="30" fill="#647f8b" font-weight="600">AI의 사건 분류 확인</text><path d="M65 533H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="556" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="585" font-size="28" fill="#293a43" font-weight="600">Completed events → scene proposals</text><text x="83" y="615" font-size="26" fill="#647f8b" font-weight="400">완료된 사건 → 저장할 기억 제안</text><rect x="65" y="640" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="669" font-size="28" fill="#293a43" font-weight="600">Unfinished event → keep for later</text><text x="83" y="699" font-size="26" fill="#647f8b" font-weight="400">진행 중인 사건 → 다음 수집에 남김</text><rect x="65" y="724" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="753" font-size="28" fill="#293a43" font-weight="600">Approve plan; optionally Hide saved ranges</text><text x="83" y="783" font-size="26" fill="#647f8b" font-weight="400">계획 승인 · 저장 구간 숨기기 선택</text><rect x="38" y="828" width="824" height="540" rx="18" fill="#fff" stroke="#cbd6dc" stroke-width="2"/><text x="65" y="871" font-size="33" fill="#293a43" font-weight="600">03 Review, save and continue</text><text x="65" y="906" font-size="30" fill="#647f8b" font-weight="600">내용 검토 · 저장 후 롤플 계속</text><path d="M65 925H835" stroke="#cbd6dc" stroke-width="2"/><rect x="65" y="948" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="977" font-size="28" fill="#293a43" font-weight="600">Nexus → key facts / continuity</text><text x="83" y="1007" font-size="26" fill="#647f8b" font-weight="400">Nexus → 핵심 정보 · 현재 상태</text><rect x="65" y="1032" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="1061" font-size="28" fill="#293a43" font-weight="600">Memory → separate completed scenes</text><text x="83" y="1091" font-size="26" fill="#647f8b" font-weight="400">Memory → 완료된 사건별 기록</text><rect x="65" y="1116" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="1145" font-size="28" fill="#293a43" font-weight="600">Latest 3 scenes → always on</text><text x="83" y="1175" font-size="26" fill="#647f8b" font-weight="400">최근 완료 Scene 3개 → 파란불</text><rect x="65" y="1200" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="1229" font-size="28" fill="#293a43" font-weight="600">Older scenes → keywords / vectors</text><text x="83" y="1259" font-size="26" fill="#647f8b" font-weight="400">이전 Scene → 키워드 또는 벡터</text><rect x="65" y="1284" width="770" height="70" rx="9" fill="#f1f4f5"/><text x="83" y="1313" font-size="28" fill="#293a43" font-weight="600">Hide only saved ranges; no chat deletion</text><text x="83" y="1343" font-size="26" fill="#647f8b" font-weight="400">저장 성공 구간만 Hide · 채팅 삭제 아님</text><text x="42" y="1416" font-size="23" fill="#647f8b" font-weight="400">Illustrated guide / 실제 캡처가 아닌 구성도</text></svg>