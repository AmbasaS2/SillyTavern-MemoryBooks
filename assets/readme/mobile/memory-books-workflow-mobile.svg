<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-label="롤플 → 기억 수집 → 다시 롤플 / Sloth's Memory Books · Everyday workflow"><title>롤플 → 기억 수집 → 다시 롤플 / Sloth's Memory Books · Everyday workflow</title><desc>Source-based bilingual illustration, synthetic examples, not a live screenshot. Actual theme and locale may differ.</desc><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif}</style><rect x="0" y="0" width="480" height="520" rx="12" fill="#f0f3f3" stroke="none"/><text x="20" y="31" font-size="18" font-weight="600" fill="#293440" text-anchor="start">롤플 → 기억 수집 → 다시 롤플</text><text x="20" y="46" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Sloth's Memory Books · Everyday workflow</text><rect x="18" y="66" width="444" height="97" rx="9" fill="#fff" stroke="#d9e0e5"/><rect x="30" y="79" width="31" height="31" rx="7" fill="#9a795c" stroke="none"/><text x="45.5" y="100" font-size="15" font-weight="650" fill="#fff" text-anchor="middle">1</text><text x="73" y="95" font-size="15" font-weight="600" fill="#293440" text-anchor="start">사건이 끝나면 기억 수집</text><text x="73" y="110" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Finish an event; collect memories</text><text x="35" y="131" font-size="13" font-weight="500" fill="#293440" text-anchor="start">수집 버튼 또는 /sloth-collect</text><text x="35" y="148" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Collection starts directly.</text><path d="M240 164L240 175" stroke="#687681" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M235 170L240 175L245 170" fill="none" stroke="#687681" stroke-width="1.5"/><rect x="18" y="178" width="444" height="97" rx="9" fill="#fff" stroke="#d9e0e5"/><rect x="30" y="191" width="31" height="31" rx="7" fill="#9a795c" stroke="none"/><text x="45.5" y="212" font-size="15" font-weight="650" fill="#fff" text-anchor="middle">2</text><text x="73" y="207" font-size="15" font-weight="600" fill="#293440" text-anchor="start">AI가 분석하고 작성</text><text x="73" y="222" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Analyze and write</text><text x="35" y="243" font-size="13" font-weight="500" fill="#293440" text-anchor="start">구간당 한 요청 · 완료 Scene과 Nexus 갱신</text><text x="35" y="260" font-size="11" font-weight="400" fill="#687681" text-anchor="start">One request per source chunk; optional review.</text><path d="M240 276L240 287" stroke="#687681" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M235 282L240 287L245 282" fill="none" stroke="#687681" stroke-width="1.5"/><rect x="18" y="290" width="444" height="97" rx="9" fill="#fff" stroke="#d9e0e5"/><rect x="30" y="303" width="31" height="31" rx="7" fill="#69907c" stroke="none"/><text x="45.5" y="324" font-size="15" font-weight="650" fill="#fff" text-anchor="middle">3</text><text x="73" y="319" font-size="15" font-weight="600" fill="#293440" text-anchor="start">검증된 내용 저장</text><text x="73" y="334" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Validate and save</text><text x="35" y="355" font-size="13" font-weight="500" fill="#293440" text-anchor="start">보류 항목은 복구용으로 남김 · 원문 확인</text><text x="35" y="372" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Inspect saved memories; unfinished ranges stay visible.</text><path d="M240 388L240 399" stroke="#687681" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M235 394L240 399L245 394" fill="none" stroke="#687681" stroke-width="1.5"/><rect x="18" y="402" width="444" height="97" rx="9" fill="#fff" stroke="#d9e0e5"/><rect x="30" y="415" width="31" height="31" rx="7" fill="#69907c" stroke="none"/><text x="45.5" y="436" font-size="15" font-weight="650" fill="#fff" text-anchor="middle">4</text><text x="73" y="431" font-size="15" font-weight="600" fill="#293440" text-anchor="start">다시 롤플!</text><text x="73" y="446" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Continue RP</text><text x="35" y="467" font-size="13" font-weight="500" fill="#293440" text-anchor="start">최근 3개 상시 · 이전 Scene 벡터/키워드</text><text x="35" y="484" font-size="11" font-weight="400" fill="#687681" text-anchor="start">Optional manual Hide applies only to saved ranges.</text></svg>
