name: Build isolated Sloth R07 prompt
on:
  push:
    branches: [automation/sloth-r07-build-20261127]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build and validate the selected writing prompt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/r07.patch"
          git switch --detach de3ae19f85783395e4f3ac626620fc5ec2298f36
          git apply --check "$RUNNER_TEMP/r07.patch"
          git apply "$RUNNER_TEMP/r07.patch"
          bun install --ignore-scripts --frozen-lockfile
          bun run build
          node --test > "$RUNNER_TEMP/tests.log" || { tail -100 "$RUNNER_TEMP/tests.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/tests.log"
          git diff --check
          git add -- nexusCollectionAI.js slothFinalWriting.test.js slothSingleCollection.test.js index.build.js index.build.js.map
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Use the tested R07 writing prompt for Sloth collection"
          git push origin HEAD:refs/heads/automation/sloth-r07-ready-20261127
