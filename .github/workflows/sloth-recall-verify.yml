name: Verify horizontal recall picker and build
on:
  push:
    branches: [fix/sloth-recall-horizontal]
permissions:
  contents: write
jobs:
  check:
    if: "!contains(github.event.head_commit.message, '[sloth-build]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: bun install --ignore-scripts
      - run: node --test
      - run: bun run build
      - name: Commit verified build outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.build.js style.build.css
          git add -f index.build.js.map
          if ! git diff --cached --quiet; then
            git commit -m "[sloth-build] Rebuild horizontal recall picker"
            git push origin HEAD:fix/sloth-recall-horizontal
          fi
