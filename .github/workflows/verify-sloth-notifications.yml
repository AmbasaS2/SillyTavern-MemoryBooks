name: Verify Sloth notification branding
on:
  push:
    branches: [sloth-notification-branding-20261127]
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies without hooks
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Notification forwarding and existing Node tests
        run: |
          node --test slothNotificationBranding.test.js
          node --test ./*.test.js
      - name: Build runtime assets
        run: bun run build
      - name: Validate compiled runtime
        run: |
          node --check index.build.js
          test -s index.build.js.map
          grep -q '🦥' index.build.js
      - name: Commit verified assets on the validation branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.build.js index.build.js.map style.build.css
          if ! git diff --cached --quiet; then
            git commit -m 'Build and verify Sloth notification branding'
            git push origin HEAD:sloth-notification-branding-20261127
          fi
