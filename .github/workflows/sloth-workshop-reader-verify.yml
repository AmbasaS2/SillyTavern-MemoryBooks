name: Verify Workshop reader and layout
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev/sloth-workshop-reading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: bun install --ignore-scripts
      - run: node --test
      - run: bun run build
      - name: Compact Workshop layout in isolated Chrome
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const t=fs.readFileSync('templates.js','utf8'),css=fs.readFileSync('style.css','utf8'),ko=JSON.parse(fs.readFileSync('locales/ko-kr.json','utf8'));
          const start=t.indexOf('<details id="stmb-manage-memories"'),end=t.indexOf('</details>',start)+10;
          if(start<0||end<start)throw Error('Workshop missing');
          const block=t.slice(start,end);
          const script=(function(){
            const q=s=>document.querySelector(s),all=s=>Array.from(document.querySelectorAll(s));
            const check=(v,m)=>{if(!v)throw Error(m)};
            try{
              const d=q('#stmb-manage-memories'),summary=d.querySelector('summary'),actions=all('[data-stmb-sloth-action]');
              check(actions.length===7,'seven actions');
              check(!d.open,'closed by default');
              check(actions.every(x=>!x.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true})),'closed tools hidden');
              summary.click();check(d.open,'native open');
              const width=d.querySelector('.stmb-workshop-menu').clientWidth;
              const compact=all('.stmb-workshop-action');
              check(compact.length===6,'six compact actions');
              check(compact.every(x=>x.getBoundingClientRect().width<width-2),'not full width');
              check(compact.every(x=>Math.abs(x.getBoundingClientRect().left-compact[0].getBoundingClientRect().left)<1),'aligned left');
              check(d.scrollWidth<=d.clientWidth+1,'no overflow');
              check(actions.every(x=>x.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true})),'visible after open');
              check(d.querySelector('.stmb-workshop-overview').querySelector('small').textContent.trim(),'overview subtitle');
              summary.click();check(!d.open,'native close');
              check(actions.every((x,i)=>x===all('[data-stmb-sloth-action]')[i]),'same DOM nodes');
              document.body.dataset.smoke='PASS';
            }catch(e){document.body.dataset.smoke='FAIL';document.body.dataset.error=e.message;}
          }).toString();
          for(const width of [390,1280])for(const lang of ['ko','en']){
            const dark=width===390;
            const theme=dark?'--SmartThemeBodyColor:#e5e7eb;--SmartThemeBorderColor:#806d4d;--SmartThemeChatTintColor:#19283b;--SmartThemeBlurTintColor:#253040':'--SmartThemeBodyColor:#222;--SmartThemeBorderColor:#ccc;--SmartThemeChatTintColor:#fff;--SmartThemeBlurTintColor:#eee';
            fs.writeFileSync('/tmp/stmb-reader-'+lang+'-'+width+'.html','<!doctype html><meta charset="utf-8"><style>:root{'+theme+';--SmartThemeEmColor:var(--SmartThemeBodyColor)}body{margin:0;width:'+width+'px;font:16px Arial;color:var(--SmartThemeBodyColor);background:var(--SmartThemeChatTintColor)}.popup{width:min(calc(100% - 24px),600px);margin:12px auto}.stmb-sloth-info{color:inherit}</style><style>'+css+'</style><div class="popup stmb-popup"><div class="stmb-workspace"><section id="stmb-sloth-panel">'+block+'</section></div></div><script>const ko='+JSON.stringify(lang==='ko'?ko:{})+';for(const x of document.querySelectorAll("[data-i18n]")){const k=x.getAttribute("data-i18n");if(ko[k]&&!x.children.length)x.textContent=ko[k];}('+script+')();</script>');
          }
          NODE
          pids=()
          for width in 390 1280; do
            for lang in ko en; do
              (
                output="/tmp/stmb-reader-result-$lang-$width"
                google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --disable-background-networking --user-data-dir="$output-profile" --window-size="$width,900" --dump-dom "file:///tmp/stmb-reader-$lang-$width.html" >"$output" 2>"$output-chrome"
                if ! grep -q 'data-smoke="PASS"' "$output"; then
                  grep -o 'data-smoke="[^"]*"\|data-error="[^"]*"' "$output" || true
                  exit 1
                fi
                echo "PASS $lang $width"
              ) &
              pids+=($!)
            done
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          exit "$failed"
      - name: Rebuild verified branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.build.js style.build.css
          git add -f index.build.js.map
          if ! git diff --cached --quiet; then
            git commit -m "[sloth-build] Rebuild Workshop reader and layout"
            git push origin HEAD:dev/sloth-workshop-reading
          fi
