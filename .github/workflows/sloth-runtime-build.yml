name: Sloth runtime regression and bundle
on:
  push:
    branches: [fix/sloth-final-stability-20261128]
permissions:
  contents: write
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node --test
      - run: bun run build
      - run: node --check index.build.js
      - name: Commit generated runtime bundle to the fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.build.js index.build.js.map style.build.css
          if ! git diff --cached --quiet; then
            git commit -m "Build tested Sloth runtime fix"
            git push origin HEAD:fix/sloth-final-stability-20261128
          fi
