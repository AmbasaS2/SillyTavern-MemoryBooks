name: Build isolated Sloth UI patch
on:
  push:
    branches: [automation/sloth-ui-polish-build-20261127]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build and test the exact UI patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/ui.patch"
          git switch --detach d7f3affaf1dd5d139107fac9c38c8f5be42a7956
          git apply --check "$RUNNER_TEMP/ui.patch"
          git apply "$RUNNER_TEMP/ui.patch"
          bun install --ignore-scripts --frozen-lockfile
          bun run build
          node --test > "$RUNNER_TEMP/tests.log" || { tail -100 "$RUNNER_TEMP/tests.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/tests.log"
          git diff --check
          git add -- locales/ko-kr.json nexusCollectorRuntime.js style.css templates.js index.build.js index.build.js.map style.build.css
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Polish Sloth setup and legacy review layout"
          git push origin HEAD:refs/heads/automation/sloth-ui-polish-ready-20261127
