name: Prepare verified stability bundle
on:
  push:
    branches: [fix/sloth-memory-write-and-scan-order-20261128]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/fix/sloth-memory-write-and-scan-order-20261128'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node --test
      - run: bun run build
      - run: node --check index.build.js
      - name: Commit generated runtime only to the fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.build.js index.build.js.map style.build.css
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild verified Memory Books runtime"
            git push origin HEAD:refs/heads/fix/sloth-memory-write-and-scan-order-20261128
          fi
