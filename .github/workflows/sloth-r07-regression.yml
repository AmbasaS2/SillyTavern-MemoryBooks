name: Sloth R07 build and regression
on:
  push:
    branches: [fix/sloth-r07-prompt-display-20261127]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node --test
      - name: Commit verified bundles to this fix branch
        run: |
          git add index.build.js index.build.js.map style.build.css
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Build verified R07 prompt display fix"
          git push origin HEAD:fix/sloth-r07-prompt-display-20261127
