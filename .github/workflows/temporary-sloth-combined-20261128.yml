name: Temporary exact four-Sloth candidate regression
on:
  push:
    branches: [fix/sloth-suite-safety-20261128]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: memory
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AmbasaS2/SillyTavern-WorldInfoInfo
          ref: d22199c2ba45409bd104d6c33010f94d746eeb3e
          path: info
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AmbasaS2/SillyTavern-LorebookOrdering
          ref: d4ef8bd83a7fe2f0fffbc669780a90f20b11e67a
          path: ordering
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AmbasaS2/lore-manager
          ref: 6b751e406c7b99ea728720d3bc26fcd09afb9632
          path: manager
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: 82b64a45c34facbc98ff4b9f33c067d3ccab6a17
          path: host
          sparse-checkout: |
            public/lib/eventemitter.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact checkout commits
        run: |
          for repo in memory info ordering manager host; do
            echo "$repo $(git -C "$repo" rev-parse HEAD)"
          done
      - run: node --test memory/ci/sloth-suite-contracts.mjs
      - working-directory: manager
        run: npm install --no-save --no-package-lock jsdom@26 jquery@3 rrweb-cssom
      - name: Exercise actual Info client through Manager reader fixtures
        working-directory: manager
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='tests/ambasa-v65-worldinfoinfo-link.test.cjs';
          let s=fs.readFileSync(path,'utf8');
          if(!s.includes('const loadLibrary = async')||!s.includes('dom, win, lib, stats, data, before,')||!s.includes('f.lib.openEntry(')) throw Error('Reader fixture changed; review integration test');
          s=s.replace('const loadLibrary = async', "const client = async () => import(pathToFileURL(join(root, '..', 'info', 'lore-library-link.js')).href);\nconst loadLibrary = async");
          s=s.replace('dom, win, lib, stats, data, before,', "dom, win, lib, stats, data, before,\n        async openViaInfo(book, uid) { const {tryOpenInLoreLibrary}=await client(); return tryOpenInLoreLibrary({world:book,uid},true,{apiVersion:1,openEntry:({book,uid})=>lib.openEntry(book,uid)}); },");
          s=s.replaceAll('f.lib.openEntry(', 'f.openViaInfo(');
          fs.writeFileSync('tests/sloth-suite-reader.test.cjs',s);
          NODE
          node --test tests/sloth-suite-reader.test.cjs
      - name: Verify actual three-repository write lanes and whole-file preservation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {withSlothLorebookWriteLane as memory} from './memory/slothWriteLane.js';
          import {withSlothLorebookWriteLane as ordering} from './ordering/slothWriteLane.js';
          import {withSlothLorebookWriteLane as manager} from './manager/slothWriteLane.js';
          let release,started;
          const gate=new Promise(r=>release=r),ready=new Promise(r=>started=r);
          const data={entries:{0:{content:'old'}},stlo:{budget:100}},events=[];
          const first=memory('same-book',async()=>{events.push('memory start');started();await gate;data.entries[1]={content:'new memory'};events.push('memory end');});
          await ready;
          const second=ordering('same-book',()=>{events.push('ordering');assert.equal(data.entries[1].content,'new memory');data.stlo.budget=400;});
          const third=manager('same-book',()=>{events.push('manager');assert.equal(data.stlo.budget,400);data.entries[0].content='edited original';});
          await manager('different-book',()=>events.push('different'));
          assert.deepEqual(events,['memory start','different']);
          release();await Promise.all([first,second,third]);
          assert.deepEqual(events,['memory start','different','memory end','ordering','manager']);
          assert.deepEqual(data,{entries:{0:{content:'edited original'},1:{content:'new memory'}},stlo:{budget:400}});
          assert.equal(globalThis[Symbol.for('sloth.worldinfo.write-lanes.v1')].has('same-book'),false);
          NODE
