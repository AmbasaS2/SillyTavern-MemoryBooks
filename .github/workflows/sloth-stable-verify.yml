name: Verify stable Sloth integration
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev/sloth-stable-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: bun install --ignore-scripts
      - run: node --test
      - run: bun run build
      - name: Commit verified browser artifacts to experiment only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.build.js style.build.css
          git add -f index.build.js.map
          if ! git diff --cached --quiet; then
            git commit -m "[sloth-build] Rebuild stable integration"
            git push origin HEAD:dev/sloth-stable-integration
          fi
