name: Verify Workshop layout
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev/sloth-workshop-menu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'
      - run: bun install --ignore-scripts
      - run: node --test
      - run: bun run build
      - name: Chrome native disclosure and layout smoke
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const t=fs.readFileSync('templates.js','utf8'),css=fs.readFileSync('style.css','utf8'),ko=JSON.parse(fs.readFileSync('locales/ko-kr.json','utf8'));
          const ids=['stmb-sloth-lorebooks','stmb-sloth-collection-settings','stmb-sloth-auto','stmb-sloth-side-prompts','stmb-manage-memories','stmb-sloth-advanced'];
          function extract(id){
            const start=t.indexOf('<details id="'+id+'"'),summaryEnd=t.indexOf('</summary>',start)+10;
            if(start<0||summaryEnd<10)throw Error(id);
            if(id==='stmb-manage-memories')return t.slice(start,t.indexOf('</details>',summaryEnd)+10);
            let h=t.slice(start,summaryEnd).replace(/\{\{[\s\S]*?\}\}/g,'');
            if(id==='stmb-sloth-lorebooks'){let n=0;h=h.replace(/<button\b[\s\S]*?<\/button>/g,m=>n++?'':m);}
            return h+'<p>Fixture content</p></details>';
          }
          for(const width of [390,1280])for(const lang of ['en','ko']){
           const name='/tmp/stmb-workshop-'+lang+'-'+width+'.html';
           const script=(
           function smoke(){
             const q=s=>document.querySelector(s),all=s=>Array.from(document.querySelectorAll(s));
             const fail=m=>{throw Error(m)},check=(v,m)=>{if(!v)fail(m)};
             try{
               const d=all('#stmb-sloth-panel > details');
               check(d.length===6,'6 settings drawers');
               check(d.filter(x=>x.open).map(x=>x.id).join(',')==='stmb-sloth-lorebooks','initial open');
               const b=q('#stmb-manage-memories'),r=d.map(x=>x.getBoundingClientRect());
               check(r.every(x=>Math.abs(x.left-r[0].left)<1&&Math.abs(x.width-r[0].width)<1),'drawer alignment');
               const h=d.map(x=>x.querySelector('summary').getBoundingClientRect().height);
               check(h.every(x=>Math.abs(x-h[0])<1),'summary heights '+h.join(','));
               const tools=all('#stmb-manage-memories button[data-stmb-sloth-action]');
               check(tools.length===7&&tools.every(x=>!x.checkVisibility({contentVisibilityAuto:true,visibilityProperty:true})),'hidden before opening');
               const old=tools.slice();
               b.querySelector('summary').click();
               check(b.open,'native opening');
               const a=tools.map(x=>x.getBoundingClientRect());
               check(a.every(x=>x.width>0&&Math.abs(x.left-a[0].left)<1&&Math.abs(x.width-a[0].width)<1),'tool alignment '+a.map(x=>x.width));
               check(b.scrollWidth<=b.clientWidth+1,'no horizontal overflow');
               b.querySelector('summary').click();check(!b.open,'native closing');
               check(old.every((x,i)=>x===all('#stmb-manage-memories button[data-stmb-sloth-action]')[i]),'no replaced nodes');
               document.body.dataset.smoke='PASS';
             }catch(e){document.body.dataset.smoke='FAIL';document.body.dataset.error=e.message;}
           }).toString();
           fs.writeFileSync(name,'<!doctype html><meta charset="utf-8"><style>:root{--SmartThemeBodyColor:#ddd;--SmartThemeBorderColor:#555;--SmartThemeChatTintColor:#222;--SmartThemeBlurTintColor:#333;--SmartThemeEmColor:#ddd}body{margin:0;width:'+width+'px;font:16px Arial;color:#ddd;background:#222}.popup{width:min(calc(100% - 24px),600px);margin:12px auto}.menu_button{display:flex;align-items:center;border:1px solid #555;background:#333;color:inherit;font:inherit}.stmb-sloth-info{color:inherit}</style><style>'+css+'</style><div class="popup stmb-popup"><div class="stmb-workspace"><section id="stmb-sloth-panel">'+ids.map(extract).join('')+'</section></div></div><script>const ko='+JSON.stringify(lang==='ko'?ko:{})+';for(const x of document.querySelectorAll("[data-i18n]")){const k=x.getAttribute("data-i18n");if(ko[k]&&!x.children.length)x.textContent=ko[k];}('+script+')();</script>');
          }
          NODE
          pids=()
          for width in 390 1280; do
            for lang in ko en; do
              (
                output="/tmp/stmb-smoke-$lang-$width"
                google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --disable-background-networking --user-data-dir="$output-profile" --window-size="$width,900" --dump-dom "file:///tmp/stmb-workshop-$lang-$width.html" >"$output" 2>"$output-chrome"
                if ! grep -q 'data-smoke="PASS"' "$output"; then
                  grep -o 'data-smoke="[^"]*"\|data-error="[^"]*"' "$output" || true
                  exit 1
                fi
                echo "PASS $lang $width"
              ) &
              pids+=($!)
            done
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          exit "$failed"
      - name: Rebuild verified branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.build.js style.build.css
          git add -f index.build.js.map
          if ! git diff --cached --quiet; then
            git commit -m "[sloth-build] Rebuild Workshop layout"
            git push origin HEAD:dev/sloth-workshop-menu
          fi
